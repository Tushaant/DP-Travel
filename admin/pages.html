<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DP Travel · Service Pages</title><style>:root{color-scheme:dark;--bg:#071321;--gold:#ffd45b;--ink:#f7f4ec;--muted:#a9b8c8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -10%,#31577a45,transparent 42%),var(--bg);color:var(--ink);font:14px/1.5 Inter,Arial,sans-serif}.shell{max-width:1100px;margin:auto;padding:26px 22px 60px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid #ffffff20;padding-bottom:18px}.brand{font:28px Georgia,serif;color:var(--gold)}.muted,label,.hint{color:var(--muted)}.panel{background:linear-gradient(145deg,#172e46,#0c1d30);border:1px solid #d5ae4540;border-radius:15px;padding:20px;margin:20px 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.full{grid-column:1/-1}input,textarea,select{width:100%;border:1px solid #8196ab55;background:#081a2b;color:var(--ink);border-radius:8px;padding:10px;font:inherit}textarea{min-height:90px}.btn{border:1px solid #8196ab55;padding:10px 14px;border-radius:9px;color:var(--ink);background:#132941;cursor:pointer}.primary{background:linear-gradient(135deg,#f6ca42,#dba91f);color:#101a27;font-weight:700}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.status{color:#27d6a2;margin-left:auto}h2{font:23px Georgia,serif;color:var(--gold)}@media(max-width:650px){.top{display:block}.fields{grid-template-columns:1fr}.full{grid-column:auto}.status{margin-left:0;width:100%}}</style></head><body><main class="shell"><header class="top"><div><div class="brand">DP Travel · Service Pages</div><div class="muted">Edit pages linked from Attestation, Verification and Embassy menus.</div></div><div><a class="btn" href="/admin/content.html">← Content Studio</a> <a class="btn" href="/admin/">Admin</a></div></header><section class="panel"><div class="fields"><div class="field"><label>Service page</label><select id="page"></select></div><div class="field"><label>Existing URL</label><input id="url" readonly></div></div><p class="hint">Existing URLs are preserved. Static page content remains the fallback until a CMS version is published.</p></section><section class="panel"><h2>Page content</h2><div class="fields"><div class="field"><label>Page title</label><input id="title" maxlength="120"></div><div class="field"><label>Eyebrow</label><input id="eyebrow" maxlength="80"></div><div class="field full"><label>Hero description</label><textarea id="description"></textarea></div><div class="field full"><label>Hero image URL (HTTPS)</label><input id="heroImage" type="url"></div><div class="field full"><label>Introduction</label><textarea id="intro"></textarea></div><div class="field full"><label>Content sections (JSON array)</label><textarea id="sections">[]</textarea></div><div class="field full"><label>FAQs (JSON array)</label><textarea id="faqs">[]</textarea></div><div class="field full"><label>Related links (JSON array)</label><textarea id="relatedLinks">[]</textarea></div><div class="field"><label>SEO title</label><input id="seoTitle"></div><div class="field"><label>SEO description</label><textarea id="seoDescription"></textarea></div><div class="field"><label>CTA title</label><input id="ctaTitle"></div><div class="field"><label>CTA button label</label><input id="ctaLabel"></div><div class="field full"><label>CTA description</label><textarea id="ctaBody"></textarea></div><div class="field full"><label>CTA URL (same-site path)</label><input id="ctaUrl"></div></div><div class="toolbar"><button class="btn" id="preview">Preview draft</button><button class="btn" id="draft">Save draft</button><button class="btn primary" id="publish">Publish</button><span id="status" class="status"></span></div></section></main><script>
const PAGES=["certificate-attestation","attestation-services-dubai","mea-attestation","hrd-attestation","apostille-attestation","birth-certificate-attestation","marriage-certificate-attestation","other-document-attestation","be-certificate-attestation","bsc-nursing-certificate-attestation","certificate-attestation-uae","certificate-attestation-dubai","certificate-attestation-india","certificate-attestation-delhi","certificate-attestation-kerala","verification-services","dataflow-verification","university-verification","certificate-verification","wes-services","icas-canada","nnas-canada","gad-attestation","notary-attestation","sdm-attestation","gamca-medical","mofa-attestation","embassy-attestation","bahrain-embassy-attestation","kuwait-embassy-attestation","qatar-embassy-attestation","oman-embassy-attestation","saudi-embassy-attestation","uae-embassy-attestation","pcc-for-uae","track-document","faq","contact"],$=id=>document.getElementById(id);PAGES.forEach(s=>{const o=document.createElement("option");o.value=s;o.textContent=s.replaceAll("-"," ");$("page").append(o)});let data={};function fill(c){data=c;for(const k of ["title","eyebrow","description","heroImage","intro","seoTitle","seoDescription","ctaTitle","ctaLabel","ctaBody","ctaUrl"])$(k).value=c[k]||"";for(const k of ["sections","faqs","relatedLinks"])$(k).value=JSON.stringify(c[k]||[],null,2);$("url").value="/services/"+c.slug+".html"}async function load(){let slug=$("page").value;$("url").value="/services/"+slug+".html";$("status").textContent="Loading…";let r=await fetch("/api/admin-pages?slug="+slug,{credentials:"same-origin"});if(r.status===401){$("status").textContent="Sign in through Admin overview first.";return}let d=await r.json();if(!r.ok)throw Error(d.error||"Load failed");fill(d.draft||d.published||{slug,title:slug.replaceAll("-"," "),eyebrow:"",description:"",heroImage:"",intro:"",sections:[],faqs:[],relatedLinks:[],seoTitle:"",seoDescription:"",ctaTitle:"",ctaLabel:"Make an enquiry",ctaBody:"",ctaUrl:"/index.html#inquiry"});$("status").textContent=d.updated_at?"Draft loaded":"No CMS record yet · static fallback active"}function collect(){let c={...data,slug:$("page").value};for(const k of ["title","eyebrow","description","heroImage","intro","seoTitle","seoDescription","ctaTitle","ctaLabel","ctaBody","ctaUrl"])c[k]=$(k).value.trim();for(const k of ["sections","faqs","relatedLinks"])c[k]=JSON.parse($(k).value||"[]");return c}async function send(action){try{let content=collect(),r=await fetch("/api/admin-pages",{method:"PUT",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,content})}),d=await r.json();if(!r.ok)throw Error(d.error||"Save failed");$("status").textContent=action==="publish"?"Published":"Draft saved"}catch(e){$("status").textContent=e.message}}$("page").onchange=()=>load().catch(e=>$("status").textContent=e.message);$("draft").onclick=()=>send("save_draft");$("publish").onclick=()=>send("publish");$("preview").onclick=()=>window.open($("url").value+"?preview=1","_blank","noopener");load().catch(e=>$("status").textContent=e.message);
</script></body></html>
