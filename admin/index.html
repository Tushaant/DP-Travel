<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DP Travel Admin · Overview</title><style>:root{color-scheme:dark;--g:#d4af37;--i:#f7f3e9;--m:#b8c3cf}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#415a7730,transparent 40%),#0d1b2a;color:var(--i);font:14px/1.5 Arial}.shell{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}.brand{font:30px Georgia;color:var(--g)}.nav{display:flex;gap:10px;flex-wrap:wrap}.nav a,.btn{border:1px solid #d4af3755;padding:9px 13px;border-radius:8px;color:var(--i);background:#1b263b;text-decoration:none;cursor:pointer}.nav .active,.primary{background:var(--g);color:#0d1b2a;font-weight:bold}.muted{color:var(--m)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.login{background:linear-gradient(145deg,#1b263b,#142235);border:1px solid #d4af3733;border-radius:14px;padding:18px}.metric{font:36px Georgia;color:var(--g);margin-top:7px}.section{margin-top:22px}.section h2{font:26px Georgia;color:var(--g)}.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.bars{display:grid;gap:11px}.bar{display:grid;grid-template-columns:130px 1fr 40px;gap:10px;align-items:center}.track{height:9px;background:#ffffff17;border-radius:9px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#415a77,#d4af37)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #ffffff18;vertical-align:top}.table th{color:var(--g)}.login{max-width:390px;margin:12vh auto}.login input{width:100%;padding:12px;background:#0d1b2a;border:1px solid #ffffff40;border-radius:8px;color:white;margin:12px 0}.error{color:#ffb8a8}.pill{font-size:11px;padding:3px 7px;border:1px solid #d4af3755;border-radius:20px;color:var(--g)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.shell{padding:17px}}@media(max-width:460px){.grid{grid-template-columns:1fr 1fr}.metric{font-size:28px}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="shell"><header class="top"><div><div class="brand">DP Travel · Admin</div><div class="muted">Website performance and visitor insights</div></div><nav class="nav"><a class="active" href="/admin/index.html">Overview</a><a href="/admin/conversations.html">Conversations</a><a href="/">View website ↗</a></nav></header><div id="login" class="login"><div class="brand">DP Travel</div><p class="muted">Private analytics workspace</p><form id="loginForm"><label>Admin password</label><input id="password" type="password" required autocomplete="current-password"><button class="btn primary">Sign in</button><p id="loginError" class="error"></p></form></div><div id="dashboard" hidden><div class="grid" id="metrics"></div><div class="cols section"><section class="card"><h2>Visits · last 14 days</h2><div id="daily" class="bars"></div></section><section class="card"><h2>Query categories</h2><div id="topics" class="bars"></div></section></div><section class="card section"><h2>Most visited pages</h2><div id="pages" class="bars"></div></section><p class="muted">Anonymous visitor/session identifiers only. IP addresses are not stored.</p></div></main><script>const $=s=>document.querySelector(s);async function load(){let r=await fetch('/api/admin-data');if(r.status===401){$('#login').hidden=false;return}let d=await r.json();if(!r.ok){$('#loginError').textContent=d.error||'Unable to load';return}$('#login').hidden=true;$('#dashboard').hidden=false;$('#metrics').innerHTML=[['Page views',d.stats.visits],['Unique visitors',d.stats.unique_visitors],['Sessions',d.stats.sessions],['Chat questions',d.stats.chat_queries]].map(x=>'<div class=card><div>'+x[0]+'</div><div class=metric>'+x[1]+'</div></div>').join('');function bars(id,a){let max=Math.max(1,...a.map(x=>x[1]));$(id).innerHTML=a.length?a.map(x=>'<div class=bar><span>'+String(x[0]).replace(/[<>]/g,'')+'</span><div class=track><div class=fill style=width:'+(x[1]/max*100)+'%></div></div><b>'+x[1]+'</b></div>').join(''):'<p>No data yet</p>'}bars('#daily',d.daily);bars('#topics',d.topics);bars('#pages',d.top_pages)}$('#loginForm').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#password').value})}),d=await r.json();if(!r.ok){$('#loginError').textContent=d.error;return}load()};load();</script></body></html>
